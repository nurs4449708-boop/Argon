<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Genshin Chess 3D</title><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none;margin:0;padding:0}body,html{width:100%;height:100%;overflow:hidden;background:#040911;font-family:'Segoe UI',Roboto,sans-serif}#canvas-container{width:100%;height:100%;position:absolute;top:0;left:0}.hud-top{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(14,29,48,0.85),rgba(8,18,32,0.92));border:1.5px solid rgba(211,188,142,0.65);border-radius:28px;padding:10px 22px;box-shadow:0 0 25px rgba(74,232,200,0.25),inset 0 0 12px rgba(211,188,142,0.2);backdrop-filter:blur(8px);z-index:10;color:#f4e8c1;white-space:nowrap}.turn-orb{width:16px;height:16px;border-radius:50%;background:#ffe17d;box-shadow:0 0 14px #ffe17d,0 0 24px #ffae00;transition:all 0.35s ease}.turn-text{font-size:15px;font-weight:700;letter-spacing:0.8px;text-shadow:0 0 10px rgba(255,225,125,0.5)}.status-badge{font-size:12px;color:#7efcd2;padding-left:8px;border-left:1px solid rgba(211,188,142,0.35);text-shadow:0 0 8px rgba(126,252,210,0.6)}.hud-bottom{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10}.genshin-btn{background:linear-gradient(180deg,rgba(26,47,72,0.9),rgba(12,25,42,0.95));color:#ece5d8;border:1.5px solid #d3bc8e;border-radius:22px;padding:10px 18px;font-size:13px;font-weight:600;box-shadow:0 4px 15px rgba(0,0,0,0.5),0 0 12px rgba(78,235,195,0.2);cursor:pointer}.genshin-btn:active{transform:scale(0.94)}.hint-bar{position:absolute;bottom:72px;width:100%;text-align:center;color:rgba(190,235,225,0.75);font-size:12px;text-shadow:0 1px 6px #000;pointer-events:none;z-index:10}</style></head><body><div id="canvas-container"></div><div class="hud-top"><div class="turn-orb" id="turnOrb"></div><div class="turn-text" id="turnText">Ход Света (Селестия)</div><div class="status-badge" id="statusBadge">Лес Авидья</div></div><div class="hint-bar">Вращай камеру пальцем • Нажми на фигуру и руну для хода</div><div class="hud-bottom"><button class="genshin-btn" onclick="resetGame()">✦ Новая партия</button><button class="genshin-btn" id="modeBtn" onclick="toggleMode()">Режим: Против ИИ</button><button class="genshin-btn" onclick="resetCamera()">Вид камеры</button></div><script src="three.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>const T=THREE;let board=[],turn='w',sel=null,valid=[],vsAI=true,over=false,camP=0;const inB=(r,c)=>r>=0&&r<8&&c>=0&&c<8,clone=b=>b.map(r=>r.map(p=>p?{t:p.t,c:p.c}:null)),b2w=(r,c)=>({x:(c-3.5)*1.25,z:(r-3.5)*1.25});function initB(){const br=['r','n','b','q','k','b','n','r'];board=Array.from({length:8},(_,r)=>Array.from({length:8},(_,c)=>r===0?{t:br[c],c:'b'}:r===1?{t:'p',c:'b'}:r===6?{t:'p',c:'w'}:r===7?{t:br[c],c:'w'}:null));turn='w';sel=null;valid=[];over=false;hud('Лес Авидья');}function rawM(b,r,c){const p=b[r][c];if(!p)return[];const m=[],col=p.c,op=col==='w'?'b':'w';if(p.t==='p'){const d=col==='w'?-1:1,sr=col==='w'?6:1;if(inB(r+d,c)&&!b[r+d][c]){m.push({r:r+d,c});if(r===sr&&!b[r+d*2][c])m.push({r:r+d*2,c});}[-1,1].forEach(dc=>{if(inB(r+d,c+dc)&&b[r+d][c+dc]?.c===op)m.push({r:r+d,c:c+dc});});}else if(p.t==='n'){[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]].forEach(([dr,dc])=>{if(inB(r+dr,c+dc)&&b[r+dr][c+dc]?.c!==col)m.push({r:r+dr,c:c+dc});});}else if(p.t==='k'){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if((dr||dc)&&inB(r+dr,c+dc)&&b[r+dr][c+dc]?.c!==col)m.push({r:r+dr,c:c+dc});}else{const ds=[];if(p.t!=='b')ds.push([-1,0],[1,0],[0,-1],[0,1]);if(p.t!=='r')ds.push([-1,-1],[-1,1],[1,-1],[1,1]);ds.forEach(([dr,dc])=>{let sr=r+dr,sc=c+dc;while(inB(sr,sc)){if(!b[sr][sc])m.push({r:sr,c:sc});else{if(b[sr][sc].c===op)m.push({r:sr,c:sc});break;}sr+=dr;sc+=dc;}});}return m;}function inChk(b,col){let kr=-1,kc=-1;for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(b[r][c]?.c===col&&b[r][c].t==='k'){kr=r;kc=c;}if(kr<0)return true;const op=col==='w'?'b':'w';for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(b[r][c]?.c===op&&rawM(b,r,c).some(m=>m.r===kr&&m.c===kc))return true;return false;}const legM=(b,r,c)=>rawM(b,r,c).filter(m=>{const cp=clone(b);cp[m.r][m.c]=cp[r][c];cp[r][c]=null;return!inChk(cp,b[r][c].c);});const hasM=(b,col)=>b.some((row,r)=>row.some((p,c)=>p?.c===col&&legM(b,r,c).length>0));const scene=new T.Scene();scene.background=new T.Color(0x040b14);scene.fog=new T.FogExp2(0x061524,0.018);const cam=new T.PerspectiveCamera(45,innerWidth/innerHeight,0.1,200),ren=new T.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));document.getElementById('canvas-container').appendChild(ren.domElement);scene.add(new T.AmbientLight(0x244c66,1.4));const dl=new T.DirectionalLight(0x88f7e2,1.4);dl.position.set(18,32,15);scene.add(dl);[[0xffd166,0,5,0,22],[0x2effa8,-12,4,-10,28],[0x9d4edd,12,4,10,28]].forEach(([c,x,y,z,d])=>{const l=new T.PointLight(c,2.4,d);l.position.set(x,y,z);scene.add(l);});const addM=(g,m,x,y,z,p=scene)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);p.add(o);return o;};addM(new T.CylinderGeometry(48,48,1,48),new T.MeshStandardMaterial({color:0x071f24,roughness:0.85}),0,-1.2,0);const alt=addM(new T.CylinderGeometry(7.2,8.2,1.2,8),new T.MeshStandardMaterial({color:0x162936,roughness:0.4,metalness:0.5,emissive:0x0a2e36,emissiveIntensity:0.5}),0,-0.65,0);alt.rotation.y=Math.PI/8;const ring=addM(new T.RingGeometry(6.3,6.65,64),new T.MeshBasicMaterial({color:0x4efce0,side:2,transparent:true,opacity:0.75}),0,-0.02,0);ring.rotation.x=-Math.PI/2;const orbs=[];for(let t=0;t<42;t++){const a=(t/42)*6.28+Math.random()*0.12,d=11.5+Math.random()*18,sc=0.85+Math.random()*1.1,tg=new T.Group(),cHex=[0x1ef5a3,0x00e5ff,0xa855f7,0xffd166][t%4];addM(new T.CylinderGeometry(0.22*sc,0.45*sc,3.8*sc,7),new T.MeshStandardMaterial({color:0x1b192e}),0,1.6*sc,0,tg);for(let i=0;i<4;i++){const cn=addM(new T.SphereGeometry((1.4-i*0.22)*sc,10,10),new T.MeshStandardMaterial({color:cHex,emissive:cHex,emissiveIntensity:0.65,transparent:true,opacity:0.88}),(Math.random()-0.5)*0.9*sc,(3.3+i*0.7)*sc,(Math.random()-0.5)*0.9*sc,tg);cn.scale.y=0.65;orbs.push({m:cn,ph:Math.random()*6.28});}tg.position.set(Math.cos(a)*d,-0.7,Math.sin(a)*d);scene.add(tg);}for(let cr=0;cr<18;cr++){const a=(cr/18)*6.28,d=7.8+Math.random()*5.5,col=[0x38f9d7,0xffd166,0xb565ff][cr%3],cg=new T.Group();for(let i=0;i<3;i++){const h=0.9+Math.random()*1.3,m=addM(new T.ConeGeometry(0.28,h,5),new T.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:0.9,metalness:0.8}),(Math.random()-0.5)*0.4,h/2,(Math.random()-0.5)*0.4,cg);m.rotation.set((Math.random()-0.5)*0.45,0,(Math.random()-0.5)*0.45);}cg.position.set(Math.cos(a)*d,-0.7,Math.sin(a)*d);scene.add(cg);}const grass=[],gGeo=new T.ConeGeometry(0.07,0.75,3);gGeo.translate(0,0.375,0);const gMats=[0x39ffbd,0x9ef01a,0x00e5ff].map(c=>new T.MeshBasicMaterial({color:c}));for(let g=0;g<1200;g++){const a=Math.random()*6.28,d=6.8+Math.random()*16.5,gx=Math.cos(a)*d,gz=Math.sin(a)*d,s=0.6+Math.random()*1.1,b=addM(gGeo,gMats[g%3],gx,-0.7,gz);b.scale.set(s,s*(0.8+Math.random()*0.6),s);b.rotation.y=Math.random()*3.14;grass.push({m:b,x:gx,o:Math.random()*6.28});}const ffN=260,ffG=new T.BufferGeometry(),ffP=new Float32Array(ffN*3),ffC=new Float32Array(ffN*3),ffS=[];for(let f=0;f<ffN;f++){ffP[f*3]=(Math.random()-0.5)*34;ffP[f*3+1]=Math.random()*12;ffP[f*3+2]=(Math.random()-0.5)*34;ffS.push(0.01+Math.random()*0.025);const c=[[0.25,1,0.78],[1,0.88,0.45],[0.75,0.48,1]][f%3];ffC.set(c,f*3);}ffG.setAttribute('position',new T.BufferAttribute(ffP,3));ffG.setAttribute('color',new T.BufferAttribute(ffC,3));const ffs=new T.Points(ffG,new T.PointsMaterial({size:0.28,vertexColors:true,transparent:true,opacity:0.9}));scene.add(ffs);const bursts=[],bGrp=new T.Group(),tiles=[],hls=[],pcs=[];scene.add(bGrp);function burst(wx,wz,col){for(let i=0;i<26;i++){const m=addM(new T.OctahedronGeometry(0.11,0),new T.MeshBasicMaterial({color:col,transparent:true,opacity:1}),wx,0.5,wz),a=Math.random()*6.28,s=0.04+Math.random()*0.12;bursts.push({m,vx:Math.cos(a)*s,vy:0.06+Math.random()*0.14,vz:Math.sin(a)*s,l:1});}}addM(new T.BoxGeometry(10.6,0.28,10.6),new T.MeshStandardMaterial({color:0x20384c,metalness:0.7,roughness:0.25,emissive:0x164e63,emissiveIntensity:0.45}),0,-0.15,0,bGrp);for(let r=0;r<8;r++)for(let c=0;c<8;c++){const l=(r+c)%2===0,p=b2w(r,c),t=addM(new T.BoxGeometry(1.22,0.18,1.22),new T.MeshStandardMaterial({color:l?0xc8f7e8:0x0e2a38,emissive:l?0x1c7d6d:0x061a24,emissiveIntensity:l?0.35:0.2,roughness:0.2,metalness:0.5}),p.x,0,p.z,bGrp);t.userData={r,c};tiles.push(t);}function mkPc(t,col){const g=new T.Group(),w=col==='w',mat=new T.MeshStandardMaterial({color:w?0xfff3d1:0x1e1b38,emissive:w?0xffc83d:0x00f0ff,emissiveIntensity:w?0.45:0.55,roughness:0.2,metalness:0.75}),gm=new T.MeshBasicMaterial({color:w?0xffe875:0x38f9d7});addM(new T.CylinderGeometry(0.38,0.45,0.18,16),mat,0,0.09,0,g);const rg=addM(new T.TorusGeometry(0.41,0.025,8,24),gm,0,0.16,0,g);rg.rotation.x=1.57;if(t==='p'){addM(new T.ConeGeometry(0.28,0.65,12),mat,0,0.45,0,g);addM(new T.OctahedronGeometry(0.18,1),gm,0,0.9,0,g);}else if(t==='r'){addM(new T.CylinderGeometry(0.28,0.33,0.85,8),mat,0,0.55,0,g);addM(new T.BoxGeometry(0.35,0.25,0.35),gm,0,1.05,0,g).rotation.y=0.78;}else if(t==='n'){addM(new T.CylinderGeometry(0.22,0.34,0.65,10),mat,0,0.45,0,g);addM(new T.ConeGeometry(0.28,0.6,4),gm,0,0.95,w?-0.08:0.08,g).rotation.x=w?-0.5:0.5;}else if(t==='b'){addM(new T.CylinderGeometry(0.18,0.34,0.85,12),mat,0,0.55,0,g);addM(new T.OctahedronGeometry(0.24,0),gm,0,1.15,0,g).scale.y=1.6;}else{const k=t==='k';addM(new T.CylinderGeometry(k?0.25:0.22,0.37,k?1.18:1.05,14),mat,0,k?0.72:0.65,0,g);addM(new T.OctahedronGeometry(0.25,k?0:1),gm,0,k?1.5:1.35,0,g).scale.y=k?1.7:1;const hl=addM(new T.TorusGeometry(0.36,0.028,8,24),gm,0,k?1.5:1.35,0,g);if(!k)hl.rotation.x=1.57;}return g;}function sync(){pcs.forEach(p=>bGrp.remove(p));pcs.length=0;hls.forEach(h=>bGrp.remove(h));hls.length=0;for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(board[r][c]){const m=mkPc(board[r][c].t,board[r][c].c),p=b2w(r,c);m.position.set(p.x,0.09,p.z);m.userData={r,c};bGrp.add(m);pcs.push(m);}if(sel){const p=b2w(sel.r,sel.c),s=addM(new T.RingGeometry(0.38,0.54,24),new T.MeshBasicMaterial({color:0xffe866,side:2}),p.x,0.12,p.z,bGrp);s.rotation.x=-1.57;hls.push(s);}valid.forEach(m=>{const p=b2w(m.r,m.c),cp=!!board[m.r][m.c],h=addM(new T.RingGeometry(cp?0.38:0.16,cp?0.56:0.34,24),new T.MeshBasicMaterial({color:cp?0xff4d6d:0x38f9d7,side:2}),p.x,0.12,p.z,bGrp);h.rotation.x=-1.57;hls.push(h);});}function hud(msg){const o=document.getElementById('turnOrb'),tx=document.getElementById('turnText'),b=document.getElementById('statusBadge'),w=turn==='w';o.style.background=w?'#ffe17d':'#38f9d7';o.style.boxShadow=w?'0 0 14px #ffe17d,0 0 24px #ffae00':'0 0 14px #38f9d7,0 0 24px #9d4edd';tx.innerText=w?'Ход Света (Селестия)':vsAI?'Мыслит Хранитель Леса...':'Ход Бездны';if(msg)b.innerText=msg;}function move(fr,fc,tr,tc){const mp=board[fr][fc],tp=board[tr][tc],wp=b2w(tr,tc);burst(wp.x,wp.z,tp?(mp.c==='w'?0xffd166:0x38f9d7):0x64dfdf);board[tr][tc]=mp;board[fr][fc]=null;if(mp.t==='p'&&(tr===0||tr===7))mp.t='q';sel=null;valid=[];turn=turn==='w'?'b':'w';sync();const chk=inChk(board,turn),hm=hasM(board,turn);if(!hm){over=true;hud(chk?(turn==='w'?'Мат! Победа Бездны':'Мат! Победа Селестии'):'Пат!');return;}hud(chk?'⚡ ШАХ КОРОЛЮ!':'Лес Авидья');if(vsAI&&turn==='b'&&!over)setTimeout(aiM,450);}function aiM(){if(over)return;const ms=[],v={p:10,n:30,b:32,r:50,q:90,k:900};for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(board[r][c]?.c==='b')legM(board,r,c).forEach(m=>{let s=Math.random()*4+(board[m.r][m.c]?v[board[m.r][m.c].t]*10:0)+(m.r>=2&&m.r<=5&&m.c>=2&&m.c<=5?6:0);ms.push({fr:r,fc:c,tr:m.r,tc:m.c,s});});if(ms.length){ms.sort((a,b)=>b.s-a.s);move(ms[0].fr,ms[0].fc,ms[0].tr,ms[0].tc);}}function tap(r,c){if(over||(vsAI&&turn==='b'))return;if(valid.some(m=>m.r===r&&m.c===c)){move(sel.r,sel.c,r,c);return;}if(board[r][c]?.c===turn){sel={r,c};valid=legM(board,r,c);}else{sel=null;valid=[];}sync();}function resetGame(){initB();sync();}function toggleMode(){vsAI=!vsAI;document.getElementById('modeBtn').innerText=vsAI?'Режим: Против ИИ':'Режим: 2 Игрока';resetGame();}let th=0,ph=0.85,rad=15.5,drag=false,lx=0,ly=0,md=0;const rc=new T.Raycaster(),pt=new T.Vector2();function upCam(){cam.position.set(rad*Math.sin(ph)*Math.sin(th),rad*Math.cos(ph),rad*Math.sin(ph)*Math.cos(th));cam.lookAt(0,0.3,0);}upCam();function resetCamera(){camP=(camP+1)%3;[th,ph,rad]=[[0,0.85,15.5],[0.65,1.05,14],[0,0.25,16.5]][camP];upCam();}function pDown(x,y){drag=true;lx=x;ly=y;md=0;}function pMove(x,y){if(!drag)return;md+=Math.abs(x-lx)+Math.abs(y-ly);th-=(x-lx)*0.007;ph=Math.max(0.22,Math.min(1.32,ph-(y-ly)*0.006));lx=x;ly=y;upCam();}function pUp(x,y){drag=false;if(md<14){pt.set((x/innerWidth)*2-1,-(y/innerHeight)*2+1);rc.setFromCamera(pt,cam);const h=rc.intersectObjects(tiles.concat(pcs),true);if(h.length){let o=h[0].object;while(o&&o.userData?.r===undefined)o=o.parent;if(o?.userData?.r!==undefined)tap(o.userData.r,o.userData.c);}}}addEventListener('touchstart',e=>e.touches.length===1&&pDown(e.touches[0].clientX,e.touches[0].clientY),{passive:true});addEventListener('touchmove',e=>e.touches.length===1&&pMove(e.touches[0].clientX,e.touches[0].clientY),{passive:true});addEventListener('touchend',()=>pUp(lx,ly),{passive:true});addEventListener('mousedown',e=>pDown(e.clientX,e.clientY));addEventListener('mousemove',e=>pMove(e.clientX,e.clientY));addEventListener('mouseup',e=>pUp(e.clientX,e.clientY));addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);});initB();sync();const clk=new T.Clock();(function anim(){requestAnimationFrame(anim);const t=clk.getElapsedTime();ring.rotation.z=t*0.18;grass.forEach(g=>g.m.rotation.z=Math.sin(t*2.2+g.x*0.5+g.o)*0.22);orbs.forEach(o=>o.m.material.emissiveIntensity=0.65+Math.sin(t*1.8+o.ph)*0.22);const pa=ffs.geometry.attributes.position.array;for(let f=0;f<ffN;f++){pa[f*3+1]+=ffS[f];pa[f*3]+=Math.sin(t+f)*0.008;if(pa[f*3+1]>12)pa[f*3+1]=0.2;}ffs.geometry.attributes.position.needsUpdate=true;for(let b=bursts.length-1;b>=0;b--){const p=bursts[b];p.m.position.x+=p.vx;p.m.position.y+=p.vy;p.m.position.z+=p.vz;p.vy-=0.004;p.l-=0.025;p.m.material.opacity=Math.max(0,p.l);if(p.l<=0){scene.remove(p.m);bursts.splice(b,1);}}ren.render(scene,cam);})();</script></body></html>
